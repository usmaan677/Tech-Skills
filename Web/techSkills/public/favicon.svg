  <rect x="6" y="7"  width="20" height="4" fill="#eff0ea"/>
  <rect x="6" y="14" width="14" height="4" fill="#eff0ea"/>
  <rect x="6" y="21" width="9"  height="4" fill="#eff0ea"/>
</svg>
